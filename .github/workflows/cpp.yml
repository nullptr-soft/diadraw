name: C++ core and native apps

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'bindings/**'
      - 'cmake/**'
      - 'tools/**'
      - '.github/workflows/cpp.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'bindings/**'
      - 'cmake/**'
      - 'tools/**'
      - '.github/workflows/cpp.yml'
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (core, CLI, gtkmm app)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-move-order.py
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtkmm-4.0-dev libcurl4-openssl-dev xvfb
      - run: cmake --workflow --preset dev-headless
      # The gtkmm app under a virtual display: the shared gesture scripts.
      - run: xvfb-run -a ctest --preset dev-gui

  macos:
    name: macOS (core, CLI, AppKit app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      # The AppKit app's gesture tests need a logged-in session, so CI leaves them out.
      - run: cmake --workflow --preset dev-headless

  windows:
    name: Windows (core, CLI, WinUI app)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --workflow --preset windows-headless

  node:
    name: Node.js addon (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'macOS'
        run: brew install ninja
      - run: npm ci
      # @diadraw/node takes its types from @diadraw/wasm; those compile without Emscripten.
      - run: npx tsc -p src/wasm/tsconfig.build.json
      - run: npm run build -w @diadraw/node
      - run: npm run typecheck -w @diadraw/node
      - run: npm test -w @diadraw/node
