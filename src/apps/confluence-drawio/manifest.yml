# Diagrams drawn in the draw.io editor, which the app bundles, for Confluence Cloud (Atlassian
# Forge). See README.md for building and deploying. `forge register` replaces app.id with the id
# of your registration.
modules:
  macro:
    - key: drawio-diagram-v2
      title: Diagram (draw.io editor V2)
      description: Draw a diagram in the open-source draw.io editor; it is shown in
        the page and stays editable.
      category: media
      layout: block
      resource: macro
      adfExport:
        function: export
      config:
        resource: editor
        title: Diagram
        viewportSize: max
        openOnInsert: true
  function:
    - key: export
      handler: index.adfExport
resources:
  - key: macro
    path: dist/macro
  - key: editor
    path: dist/editor
permissions:
  content:
    # draw.io, bundled in the editor resource (dist/editor/drawio), sets styles inline throughout.
    styles:
      - unsafe-inline
    # draw.io evaluates JavaScript expressions in a few shapes and imports (mxUtils.eval).
    scripts:
      - unsafe-eval
  # A build with DRAWIO_URL loads draw.io from that origin instead, which needs it listed here:
  # external:
  #   frames:
  #     - address: https://embed.diagrams.net
  #       inScopeEUD: true
app:
  id: ari:cloud:ecosystem::app/b30e6926-1d5d-4d30-a04d-d11d48fd387a
  runtime:
    name: nodejs22.x
