<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>draw.io diagrams for Confluence: local preview</title>
    <style>
      body {
        margin: 0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        display: grid;
        grid-template-rows: auto 640px auto 1fr;
        height: 100vh;
      }
      h1 {
        font-size: 14px;
        margin: 8px 12px;
      }
      iframe {
        border: 1px solid #ccc;
        width: 100%;
        height: 100%;
      }
      #page {
        padding: 0 12px 12px;
        overflow: auto;
      }
      #page iframe {
        height: 420px;
      }
    </style>
  </head>
  <body>
    <h1>Macro editor (what Confluence opens from Edit)</h1>
    <iframe id="editor" src="editor/index.html"></iframe>
    <h1>Macro in a page (reloads on Save &amp; Exit)</h1>
    <div id="page"><iframe id="macro" src="macro/index.html"></iframe></div>
    <script>
      const reload = (id) => document.getElementById(id).contentWindow.location.reload();
      addEventListener('message', (event) => {
        if (event.data === 'drawio-dev-saved') reload('macro');
        if (event.data === 'drawio-dev-saved' || event.data === 'drawio-dev-closed')
          reload('editor');
      });
    </script>
  </body>
</html>
